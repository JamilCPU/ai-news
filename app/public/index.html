<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNAL — AI Intelligence for Builders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #080c10;
  --bg2:       #0b0f18;
  --surface:   #0e1520;
  --surface2:  #121b28;
  --border:    #182230;
  --border2:   #1e2c3d;
  --text:      #e0e8f4;
  --text2:     #8aa4be;
  --text3:     #4a6880;
  --teal:      #00d4aa;
  --teal-dim:  rgba(0,212,170,0.06);
  --teal-glow: rgba(0,212,170,0.18);
  --fh: 'Syne', sans-serif;
  --fs: 'DM Sans', sans-serif;
  --fm: 'JetBrains Mono', monospace;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--fs);
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── MASTHEAD ──────────────────────────────────────────────────────────────── */
.masthead {
  border-top: 2px solid var(--teal);
  border-bottom: 1px solid var(--border2);
  background: var(--bg);
  padding: 0 clamp(16px, 4vw, 56px);
}
.masthead-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 0;
  gap: 20px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
  user-select: none;
}
.brand-waveform path {
  stroke-dasharray: 90;
  stroke-dashoffset: 90;
  animation: drawwave 1.1s cubic-bezier(.4,0,.2,1) 0.2s forwards;
}
@keyframes drawwave { to { stroke-dashoffset: 0; } }
.brand-text { display: flex; flex-direction: column; gap: 3px; }
.brand-wordmark {
  font-family: var(--fh);
  font-weight: 800;
  font-size: 26px;
  letter-spacing: -0.02em;
  color: var(--text);
  line-height: 1;
}
.brand-tagline {
  font-family: var(--fm);
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--teal);
  line-height: 1;
}
.masthead-right {
  display: flex;
  align-items: center;
  gap: 20px;
}
.masthead-date {
  font-family: var(--fm);
  font-size: 11px;
  color: var(--text3);
  letter-spacing: 0.06em;
}
.masthead-vol {
  font-family: var(--fm);
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* ── TICKER ────────────────────────────────────────────────────────────────── */
.ticker-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 clamp(16px, 4vw, 56px);
  height: 36px;
  display: flex;
  align-items: center;
  gap: 16px;
  overflow: hidden;
}
.ticker-label {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--fm);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--bg);
  background: var(--teal);
  padding: 3px 8px;
  border-radius: 2px;
  line-height: 1;
}
.ticker-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--bg);
  animation: blink 1.8s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
.ticker-track {
  flex: 1;
  overflow: hidden;
  position: relative;
  height: 100%;
  display: flex;
  align-items: center;
}
.ticker-track::before,
.ticker-track::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 36px;
  z-index: 2;
  pointer-events: none;
}
.ticker-track::before { left: 0;  background: linear-gradient(90deg, var(--surface), transparent); }
.ticker-track::after  { right: 0; background: linear-gradient(-90deg, var(--surface), transparent); }
.ticker-scroll {
  display: flex;
  gap: 0;
  white-space: nowrap;
  animation: ticker 50s linear infinite;
}
.ticker-scroll:hover { animation-play-state: paused; }
.ticker-item {
  font-family: var(--fm);
  font-size: 11px;
  color: var(--text2);
  padding: 0 36px;
}
.ticker-item::before { content: '◆ '; color: var(--teal); opacity: 0.5; font-size: 8px; }
@keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

/* ── PAGE CONTENT ──────────────────────────────────────────────────────────── */
.page-content {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 clamp(16px, 4vw, 56px);
}

/* ── SECTION RULE ──────────────────────────────────────────────────────────── */
.section-rule {
  border: none;
  border-top: 3px solid var(--teal);
  margin: 40px 0 0;
}
.section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 10px 0 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0;
}
.section-label {
  font-family: var(--fm);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--teal);
}
.section-meta {
  font-family: var(--fm);
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 0.06em;
}

/* ── FRONT GRID ────────────────────────────────────────────────────────────── */
.front-grid {
  display: grid;
  grid-template-columns: 1fr 1px 300px;
  gap: 0 0;
  min-height: 340px;
}
.col-divider {
  background: var(--border2);
  margin: 0;
}

/* ── FEATURED ──────────────────────────────────────────────────────────────── */
.featured {
  padding: 32px 36px 32px 0;
  animation: fadein 0.45s ease both 0.1s;
}
.featured-eyebrow {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}
.pill-today {
  font-family: var(--fm);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--bg);
  background: var(--teal);
  padding: 3px 8px;
  border-radius: 2px;
}
.featured-date-label {
  font-family: var(--fm);
  font-size: 11px;
  color: var(--text3);
  letter-spacing: 0.06em;
}
.featured-headline {
  font-family: var(--fh);
  font-weight: 800;
  font-size: clamp(26px, 3.2vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.025em;
  color: var(--text);
  margin-bottom: 18px;
  text-decoration: none;
  display: block;
  transition: color 0.15s;
}
.featured-headline:hover { color: var(--teal); }
.featured-lede {
  font-size: 16px;
  line-height: 1.72;
  color: #bdd0e4;
  margin-bottom: 24px;
  font-weight: 400;
  max-width: 640px;
}
.featured-footer {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.badge {
  font-family: var(--fm);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--text3);
  text-transform: uppercase;
  border: 1px solid var(--border2);
  padding: 4px 10px;
  border-radius: 2px;
}
.badge-stories {
  color: var(--teal);
  border-color: rgba(0,212,170,0.3);
}
.read-link {
  margin-left: auto;
  font-family: var(--fm);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--teal);
  text-decoration: none;
  transition: opacity 0.15s;
  white-space: nowrap;
}
.read-link:hover { opacity: 0.65; }
.read-link::after { content: ' →'; }

/* ── SIDEBAR ───────────────────────────────────────────────────────────────── */
.sidebar {
  padding: 0 0 0 28px;
  display: flex;
  flex-direction: column;
  animation: fadein 0.45s ease both 0.2s;
}
.sidebar-story {
  padding: 22px 0;
  border-bottom: 1px solid var(--border);
  text-decoration: none;
  display: block;
}
.sidebar-story:first-child { padding-top: 28px; }
.sidebar-story:last-child { border-bottom: none; padding-bottom: 28px; }
.sidebar-story:hover .sidebar-headline { color: var(--teal); }
.sidebar-eyebrow {
  font-family: var(--fm);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 8px;
}
.sidebar-headline {
  font-family: var(--fs);
  font-size: 15px;
  font-weight: 600;
  line-height: 1.35;
  color: var(--text);
  margin-bottom: 8px;
  transition: color 0.15s;
}
.sidebar-lede {
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--text2);
  margin-bottom: 10px;
}
.sidebar-count {
  font-family: var(--fm);
  font-size: 10px;
  color: var(--text3);
  letter-spacing: 0.06em;
}

/* ── ARCHIVE ───────────────────────────────────────────────────────────────── */
.archive-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  margin-bottom: 72px;
  animation: fadein 0.5s ease both 0.3s;
}
.archive-card {
  background: var(--bg);
  padding: 20px 18px;
  text-decoration: none;
  display: block;
  transition: background 0.15s;
}
.archive-card:hover { background: var(--surface); }
.archive-card:hover .archive-headline { color: var(--teal); }
.archive-card-date {
  font-family: var(--fm);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--teal);
  margin-bottom: 8px;
}
.archive-card-headline {
  font-family: var(--fs);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.35;
  color: var(--text);
  margin-bottom: 7px;
  transition: color 0.15s;
}
.archive-card-lede {
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--text2);
  margin-bottom: 12px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.archive-card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.archive-card-count {
  font-family: var(--fm);
  font-size: 10px;
  color: var(--text3);
}
.archive-card-arrow {
  font-family: var(--fm);
  font-size: 11px;
  color: var(--teal);
  opacity: 0;
  transition: opacity 0.15s;
}
.archive-card:hover .archive-card-arrow { opacity: 1; }

/* ── STATES ────────────────────────────────────────────────────────────────── */
.state-loading {
  padding: 56px 0;
  font-family: var(--fm);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text3);
  animation: fadein 0.3s ease both;
}
.state-loading::after {
  content: '';
  display: inline-block;
  animation: ellipsis 1.4s steps(4, end) infinite;
}
@keyframes ellipsis {
  0%   { content: ''; }
  25%  { content: '.'; }
  50%  { content: '..'; }
  75%  { content: '...'; }
}
.state-error {
  padding: 56px 0;
  font-family: var(--fm);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: #d05050;
}
.state-empty {
  padding: 56px 0;
  font-family: var(--fm);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--text3);
  text-transform: uppercase;
}

/* ── ANIMATIONS ────────────────────────────────────────────────────────────── */
@keyframes fadein {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── RESPONSIVE ────────────────────────────────────────────────────────────── */
@media (max-width: 900px) {
  .front-grid { grid-template-columns: 1fr; }
  .col-divider { display: none; }
  .featured { padding: 28px 0 0; }
  .sidebar {
    padding: 0;
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }
  .sidebar-story:first-child { padding-top: 20px; }
  .sidebar-story:last-child { padding-bottom: 20px; }
}
@media (max-width: 560px) {
  .masthead-vol { display: none; }
  .brand-wordmark { font-size: 22px; }
  .archive-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 400px) {
  .archive-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- MASTHEAD -->
<header class="masthead">
  <div class="masthead-inner">
    <a href="/" class="brand">
      <svg class="brand-waveform" width="38" height="28" viewBox="0 0 38 28" fill="none">
        <path d="M2 14 L7 5 L11 21 L15 3 L19 23 L23 9 L27 19 L31 11 L36 14"
              stroke="#00d4aa" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="brand-text">
        <span class="brand-wordmark">SIGNAL</span>
        <span class="brand-tagline">AI Intelligence for Builders</span>
      </div>
    </a>
    <div class="masthead-right">
      <span class="masthead-vol" id="vol-label"></span>
      <span class="masthead-date" id="today-date"></span>
    </div>
  </div>
</header>

<!-- TICKER -->
<div class="ticker-bar">
  <div class="ticker-label">
    <span class="ticker-dot"></span>Live
  </div>
  <div class="ticker-track">
    <div class="ticker-scroll" id="ticker-scroll">
      <span class="ticker-item">Initializing feed</span>
      <span class="ticker-item">Initializing feed</span>
    </div>
  </div>
</div>

<!-- CONTENT -->
<main class="page-content" id="main">
  <div class="state-loading">Fetching latest intelligence</div>
</main>

<script>
(function () {
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const MON_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function fmtShort(s) {
    const [y,m,d] = s.split('-').map(Number);
    return `${MON[m-1]} ${d}, ${y}`;
  }
  function fmtLong(s) {
    const [y,m,d] = s.split('-').map(Number);
    return `${MON_FULL[m-1].toUpperCase()} ${d}, ${y}`;
  }
  function clip(t, n) {
    if (!t) return '';
    if (t.length <= n) return t;
    const i = t.lastIndexOf(' ', n);
    return t.slice(0, i > 0 ? i : n) + '…';
  }
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Set today's date
  const now = new Date();
  document.getElementById('today-date').textContent =
    `${MON[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;

  function buildTicker(digests) {
    const items = (digests.length ? digests : [{title:'No digests yet', date:''}])
      .slice(0, 8)
      .map(d => `<span class="ticker-item">${esc(d.title)}${d.date ? ' · ' + fmtShort(d.date) : ''}</span>`)
      .join('');
    // Duplicate for seamless loop
    document.getElementById('ticker-scroll').innerHTML = items + items;
  }

  function renderFeatured(d) {
    return `
<div class="featured">
  <div class="featured-eyebrow">
    <span class="pill-today">Today</span>
    <span class="featured-date-label">${fmtLong(d.date)}</span>
  </div>
  <a href="/digests/${esc(d.filename)}" class="featured-headline">${esc(d.title)}</a>
  <p class="featured-lede">${esc(clip(d.overview, 280))}</p>
  <div class="featured-footer">
    <span class="badge">${fmtShort(d.date)}</span>
    <span class="badge badge-stories">${d.item_count} stories</span>
    <a href="/digests/${esc(d.filename)}" class="read-link">Read digest</a>
  </div>
</div>`;
  }

  function renderSidebar(d) {
    return `
<a href="/digests/${esc(d.filename)}" class="sidebar-story">
  <div class="sidebar-eyebrow">${fmtShort(d.date)}</div>
  <div class="sidebar-headline">${esc(d.title)}</div>
  <div class="sidebar-lede">${esc(clip(d.overview, 110))}</div>
  <div class="sidebar-count">${d.item_count} stories</div>
</a>`;
  }

  function renderArchive(d) {
    return `
<a href="/digests/${esc(d.filename)}" class="archive-card">
  <div class="archive-card-date">${fmtLong(d.date)}</div>
  <div class="archive-card-headline">${esc(d.title)}</div>
  <div class="archive-card-lede">${esc(d.overview || '')}</div>
  <div class="archive-card-footer">
    <span class="archive-card-count">${d.item_count} stories</span>
    <span class="archive-card-arrow">→</span>
  </div>
</a>`;
  }

  function render(rawDigests) {
    // Sort by date descending, then deduplicate — newest date is always featured
    const seen = new Set();
    const digests = [...rawDigests]
      .sort((a, b) => b.date.localeCompare(a.date))
      .filter(d => {
        if (seen.has(d.date)) return false;
        seen.add(d.date);
        return true;
      });

    const main = document.getElementById('main');
    buildTicker(digests);

    if (!digests.length) {
      main.innerHTML = '<div class="state-empty">No digests published yet — check back after 7am.</div>';
      return;
    }

    document.getElementById('vol-label').textContent =
      `Vol. ${digests.length}`;

    const [featured, ...rest] = digests;
    const sidebar = rest.slice(0, 3);
    const archive = rest.slice(3);

    let html = `
<hr class="section-rule">
<div class="section-header">
  <span class="section-label">Latest Edition</span>
  <span class="section-meta">${digests.length} digest${digests.length !== 1 ? 's' : ''} published</span>
</div>
<div class="front-grid">
  ${renderFeatured(featured)}
  <div class="col-divider"></div>
  <div class="sidebar">
    ${sidebar.length
      ? sidebar.map(renderSidebar).join('')
      : '<div class="state-empty" style="padding:28px 0 0;font-size:11px">More coming tomorrow.</div>'}
  </div>
</div>`;

    if (archive.length) {
      html += `
<hr class="section-rule">
<div class="section-header">
  <span class="section-label">Previous Editions</span>
  <span class="section-meta">${archive.length} archived</span>
</div>
<div class="archive-grid">
  ${archive.map(renderArchive).join('')}
</div>`;
    } else {
      html += '<div style="padding-bottom:72px"></div>';
    }

    main.innerHTML = html;
  }

  fetch('/digests/index.json')
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(render)
    .catch(err => {
      document.getElementById('main').innerHTML =
        `<div class="state-error">Failed to load digests (${err}). Is the server running?</div>`;
      buildTicker([]);
    });
})();
</script>
</body>
</html>
